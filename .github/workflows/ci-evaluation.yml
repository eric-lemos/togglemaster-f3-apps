name: CI Evaluation Service

on:
    pull_request:
        paths:
            - "apps/evaluation-service/**"
            - ".github/workflows/ci-evaluation.yml"
    push:
        branches:
            - main
        paths:
            - "apps/evaluation-service/**"
            - ".github/workflows/ci-evaluation.yml"
    workflow_dispatch:

permissions:
    contents: read

env:
    GO_VERSION: "1.26.0"
    AWS_REGION: ${{ vars.AWS_REGION }}
    ECR_REPOSITORY: togglemaster/evaluation
    IMAGE_NAME: evaluation-service
    GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
    GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH }}
    GITOPS_MANIFEST_PATH: ${{ vars.GITOPS_EVALUATION_MANIFEST_PATH }}

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/evaluation-service
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: apps/evaluation-service/go.sum
            - name: Download dependencies
              run: go mod download
            - name: Compile
              run: go build ./...
            - name: Unit tests
              run: go test ./... -count=1

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: apps/evaluation-service/go.sum
            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.13.2
                  working-directory: apps/evaluation-service

    security:
        name: Security
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: apps/evaluation-service/go.sum
            - name: Run gosec (SAST)
              uses: securego/gosec@v2.29.0
              with:
                  args: ./apps/evaluation-service/...
            - name: Run Trivy filesystem scan (SCA)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: fs
                  scan-ref: apps/evaluation-service
                  ignore-unfixed: true
                  severity: CRITICAL
                  exit-code: "1"
                  format: table

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, security]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build image
              run: docker build --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" apps/evaluation-service
            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  ignore-unfixed: true
                  severity: CRITICAL
                  exit-code: "1"
                  format: table
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  aws-region: ${{ env.AWS_REGION }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            - name: Log in to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
            - name: Tag and push image
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
              run: |
                  docker tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
                  docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

            - name: Checkout GitOps repository
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/checkout@v5
              with:
                  repository: ${{ env.GITOPS_REPOSITORY }}
                  ref: ${{ env.GITOPS_BRANCH }}
                  token: ${{ secrets.GITOPS_TOKEN }}
                  path: gitops

            - name: Update GitOps manifest
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              working-directory: gitops
              env:
                  IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
                  MANIFEST_PATH: ${{ env.GITOPS_MANIFEST_PATH }}
              run: |
                  python3 - "$MANIFEST_PATH" "$IMAGE" <<'PY'
                  from pathlib import Path
                  import re
                  import sys

                  manifest_path, image = sys.argv[1:]
                  path = Path(manifest_path)
                  content = path.read_text()
                  updated, replacements = re.subn(r"(?m)^(\s*image:\s*).+$", rf"\1{image}", content, count=1)
                  if replacements != 1:
                    raise SystemExit(f"Campo image não encontrado: {manifest_path}")
                  path.write_text(updated)
                  PY
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "$MANIFEST_PATH"
                  if git diff --cached --quiet; then exit 0; fi
                  git commit -m "chore: update ${MANIFEST_PATH} image"
                  git push
