name: CI Targeting Service

on:
    pull_request:
        paths:
            - "apps/targeting-service/**"
            - ".github/workflows/ci-targeting.yml"
    push:
        branches: [main]
        paths:
            - "apps/targeting-service/**"
            - ".github/workflows/ci-targeting.yml"

permissions:
    contents: read

env:
    PYTHON_VERSION: "3.11"
    AWS_REGION: ${{ vars.AWS_REGION }}
    ECR_REPOSITORY: ${{ vars.ECR_TARGETING_REPOSITORY }}
    IMAGE_NAME: targeting-service

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/targeting-service
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
                  cache-dependency-path: apps/targeting-service/requirements.txt
            - name: Install dependencies
              run: python -m pip install --upgrade pip && pip install -r requirements.txt
            - name: Compile Python sources
              run: python -m compileall -q .

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install Ruff
              run: python -m pip install ruff
            - name: Run Ruff
              run: ruff check apps/targeting-service

    security:
        name: Security
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Run Trivy filesystem scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: fs
                  scan-ref: apps/targeting-service
                  ignore-unfixed: true
                  severity: CRITICAL
                  exit-code: "1"
                  format: table

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, security]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build image
              run: docker build --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" apps/targeting-service
            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  ignore-unfixed: true
                  severity: CRITICAL
                  exit-code: "1"
                  format: table
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  aws-region: ${{ env.AWS_REGION }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            - name: Log in to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
            - name: Tag and push image
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
              run: |
                  docker tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:v1.0.0-${{ github.sha }}"
                  docker tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
                  docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:v1.0.0-${{ github.sha }}"
                  docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
